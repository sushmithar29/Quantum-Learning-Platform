<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quantum Linear Algebra: Matrix & Vector Operations – QuantumLab</title>
  <meta name="description" content="Interactive guided learning module for Quantum Linear Algebra: Matrix and Vector Operations. Explore matrix addition, matrix multiplication, Kronecker tensor product, state vector transformations, and unitarity." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../../styles/main.css" />
  <link rel="stylesheet" href="../../styles/learn.css" />
</head>
<body class="la-module-page">

  <div class="la-module-container">

    <!-- TOP HEADER -->
    <header class="la-header-bar">
      <div class="la-header-bar__left">
        <a href="../../learn.html" class="la-back-link" id="la-back-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
          Back to Learn
        </a>
        <div class="la-header-title-group">
          <h1>Quantum Linear Algebra</h1>
          <p>Matrix &amp; Vector Operations · Interactive Guided Learning</p>
        </div>
      </div>
      <div class="la-header-actions">
        <button class="la-btn-sm" onclick="QL.LinearAlgebraUI.resetSimulation()" title="Reset all matrices and return to Step 1">
          ↺ Reset Simulation
        </button>
      </div>
    </header>

    <!-- HORIZONTAL STEPPER -->
    <div class="la-stepper-wrap">
      <div id="la-stepper-mount"></div>
    </div>

    <!-- MAIN TWO-COLUMN WORKSPACE -->
    <main class="la-workspace">
      
      <!-- LEFT COLUMN: CONTROLS & STEP WIZARD -->
      <section class="la-panel-left" id="la-panel-mount">
        <!-- Rendered by linear-algebra-ui.js -->
      </section>

      <!-- RIGHT COLUMN: LIVE VISUALIZATION & QUANTUM CONTEXT -->
      <aside class="la-panel-right">
        
        <!-- Live Mathematical Preview Card -->
        <div class="la-viz-card">
          <div class="la-viz-header">
            <div class="la-viz-tag">Live Mathematical Preview</div>
            <div class="la-viz-stage-badge">REAL-TIME</div>
          </div>
          <div class="la-viz-display" id="la-viz-mount">
            <!-- Rendered by linear-algebra-ui.js -->
          </div>
        </div>

        <!-- Educational Quantum Context Card -->
        <div class="la-edu-card" id="la-edu-mount">
          <!-- Rendered by linear-algebra-ui.js -->
        </div>

      </aside>

    </main>

  </div>

  <!-- SCRIPTS -->
  <script src="../../js/linear-algebra-engine.js"></script>
  <script src="../../js/linear-algebra-ui.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      QL.LinearAlgebraUI.init();
    });
  </script>
</body>
</html>
